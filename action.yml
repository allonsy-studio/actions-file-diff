name: File comparisons
description: Compares files between branches and reports size changes back on the pull request.
author: castastrophe
branding:
    icon: bar-chart-2
    color: blue

inputs:
    head-path:
        description: Path to file or directory for file sizes analysis.
        required: false
        default: ${{ github.workspace }}
    base-path:
        description: Optional path to another directory to perform file size diff against the provided path.
        required: false
    token:
        description: GITHUB_TOKEN for the repository.
        required: false
        default: ${{ github.token }}
    file-glob-pattern:
        description: Glob pattern for filtering of the files.
        required: false
        default: "**/dist/**"
    comment:
        description: Whether to comment on the PR.
        required: false
        default: "true"
    comment-header:
        description: Comment header to be used in the PR comment. Also identifies the sticky comment, so distinct headers allow multiple instances to coexist.
        required: false
        default: "## File metrics"
    build-dir:
        description: Path segment separating a package from its built output. Files are grouped into a package named by the directory immediately before this segment; the readable filename is the path after it.
        required: false
        default: "dist"
    main-file:
        description: Fallback filename (relative to the build dir) treated as a package's main file.
        required: false
        default: "index.js"
    read-package-json:
        description: When true, use the `main` field of a package's package.json (relative to the build dir) as its main file instead of `main-file`.
        required: false
        default: "true"
    extensions:
        description: Optional list (multiline or comma-separated) of base extensions to report and count, e.g. `css, js`. `.map`, `.gz` and `.min` layers are stripped before comparing. Empty reports all files.
        required: false
        default: ""

    visual-diff:
        description: "Where to publish the visual diff (size chart, line diffs and changed images) linked from the comment. `summary` writes collapsible sections to the job summary and links the run. `branch` also commits a tabbed HTML page to `report-branch` (needs contents write permission and GitHub Pages). `none` turns it off."
        required: false
        default: "summary"
    report-branch:
        description: Branch the HTML report is committed to when `visual-diff` is `branch`. Created as an orphan branch when missing.
        required: false
        default: "file-diff-reports"
    pages-url:
        description: Base URL that serves `report-branch`. Defaults to the repository's GitHub Pages URL.
        required: false
        default: ""
    max-diff-size:
        description: Largest file (in bytes) that gets a line diff. Larger files are listed without one.
        required: false
        default: "262144"

outputs:
    has-changed:
        description: '"true" when the head total differs from the base total; "false" otherwise, including when there is no base.'
    total-size:
        description: Integer byte total of the head, summing all reported files and using the minified size where one exists.
    report-url:
        description: "Link to the visual diff: the published page, or the workflow run's summary. Empty when `visual-diff` is `none` or outside a runner."

runs:
    using: node24
    main: dist/index.cjs
